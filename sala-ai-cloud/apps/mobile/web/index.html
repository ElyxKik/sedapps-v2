<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sala AI — Crée ton site professionnel en quelques minutes.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sala AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sala AI — Créateur de sites professionnels</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      width: 100%; height: 100%; margin: 0; background: #071426;
    }
    #flutter-splash {
      position: fixed; inset: 0; z-index: 999999; display: grid;
      place-items: center; overflow: hidden;
      background: radial-gradient(circle at 50% 42%, rgba(29, 78, 216, .24), transparent 30%),
        linear-gradient(145deg, #071426 0%, #0a1c35 55%, #071426 100%);
      opacity: 1; visibility: visible;
      transition: opacity 360ms ease, visibility 360ms ease;
    }
    #flutter-splash::before {
      content: ""; position: absolute; width: 260px; height: 260px;
      border: 1px solid rgba(96, 165, 250, .1); border-radius: 50%;
      animation: splash-ring 2s ease-out infinite;
    }
    #flutter-splash.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash-logo-wrap {
      position: relative; display: grid; width: 116px; height: 116px; place-items: center;
      border: 1px solid rgba(255, 255, 255, .1); border-radius: 30px;
      background: rgba(255, 255, 255, .06);
      box-shadow: 0 22px 70px rgba(0, 0, 0, .36), 0 0 50px rgba(37, 99, 235, .15);
      backdrop-filter: blur(12px); animation: splash-pulse 1.65s ease-in-out infinite;
    }
    .splash-logo { width: 76px; height: 76px; object-fit: contain; }
    @keyframes splash-pulse { 0%, 100% { transform: scale(.94); opacity: .78; } 50% { transform: scale(1.04); opacity: 1; } }
    @keyframes splash-ring { 0% { transform: scale(.55); opacity: 0; } 30% { opacity: .8; } 100% { transform: scale(1.15); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .splash-logo-wrap, #flutter-splash::before { animation: none; } }
  </style>
</head>
<body>
  <div id="flutter-splash" role="status" aria-label="Chargement de Sala AI">
    <div class="splash-logo-wrap">
      <img class="splash-logo" src="icons/Icon-192.png" alt="Sala AI">
    </div>
  </div>
  <script>
    (() => {
      const hideSplash = () => {
        const splash = document.getElementById('flutter-splash');
        if (!splash || splash.classList.contains('is-hidden')) return;
        splash.classList.add('is-hidden');
        window.setTimeout(() => splash.remove(), 400);
      };
      // Do not hide on Flutter DOM insertion: it happens before its first paint.
      window.addEventListener('flutter-first-frame', hideSplash, { once: true });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
