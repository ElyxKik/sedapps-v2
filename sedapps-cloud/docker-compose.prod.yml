services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 320m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 128m

  core-api:
    build: ./services/core-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers
    mem_limit: 256m

  ai-orchestrator:
    build: ./services/ai-orchestrator
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:8001:8001"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --proxy-headers
    mem_limit: 192m

  ai-worker:
    build: ./services/ai-orchestrator
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: celery -A app.celery_app.celery worker --loglevel=INFO --concurrency=1 --uid=nobody --gid=nogroup
    mem_limit: 192m

  deploy-service:
    build: ./services/deploy-service
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis: { condition: service_healthy }
      core-api: { condition: service_started }
    ports:
      - "127.0.0.1:8002:8002"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --proxy-headers
    mem_limit: 192m

  deploy-worker:
    build: ./services/deploy-service
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis: { condition: service_healthy }
      core-api: { condition: service_started }
    command: celery -A app.celery_app.celery worker --loglevel=INFO --concurrency=1 --uid=nobody --gid=nogroup
    mem_limit: 256m

volumes:
  pgdata:
  redisdata:
